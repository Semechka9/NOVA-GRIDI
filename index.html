<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>NOVA GRID — puzzle game</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-wrap">
      <div class="hud">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <span class="eyebrow">PUZZLE / 01</span>
            <h1>NOVA GRID</h1>
          </div>
        </div>
        <label class="theme-control">
          <span>THEME</span>
          <select id="themeSelect" aria-label="Выбрать тему">
            <option value="auto">Auto</option>
            <option value="default">Base</option>
            <option value="sunset">Sunset</option>
            <option value="ocean">Ocean</option>
            <option value="lime">Lime</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <div class="score-box" aria-label="Счёт">
          <span class="score-label">SCORE</span>
          <strong id="score">0</strong>
        </div>
        <button id="newGameBtn" class="new-btn" aria-label="Начать новую игру" title="Новая игра">↻</button>
      </div>

      <div class="board-shell">
        <canvas id="game" width="320" height="320" aria-label="Игровое поле NOVA GRID"></canvas>
      </div>

      <section class="pieces-panel" aria-label="Фигуры для размещения">
        <div class="pieces-heading">
          <span>Следующие фигуры</span>
          <span class="pieces-hint">перетащи на поле</span>
        </div>
        <div id="piecesTray" class="pieces-tray"></div>
      </section>
    </main>

    <script src="script.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
      }
    </script>
  </body>
</html>
